{% extends 'navigationbar.html' %}
{% load static %}

{% block body %}


<div class="container" style="margin-top: 50px">
    <h2 class="text-center">view Patient</h2>
<br><br>
<table class="table table-hover" id="example"  >
    <thead>
        <tr>
            <th>Patient ID</th>
            <th>Patient Name</th>
            <th>Gender</th>
            <th>Contact</th>
            <th>Address</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
          {% for i in pat %}
          <tr>
           <td>{{i.id}}</td>
           <td>{{i.name}}</td>
           <td>{{i.gender}}</td>
           <td>{{i.mobile}}</td>
           <td>{{i.address}}</td>
<td>
    <form action="{% url 'delete_patient' i.id %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit"
                class="btn btn-danger"
                onclick="return confirm('Are you sure you want to delete this patient?');">
            Delete
        </button>
    </form>
</td>
          </tr>
          {% endfor %}




    </tbody>
</table>

</div>

{% endblock %}
