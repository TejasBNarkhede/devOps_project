{% extends 'navigationbar.html' %}
{% load static %}

{% block body %}


<div class="container" style="margin-top: 50px">
    <h2 class="text-center">view Appointment</h2>
<br><br>
<table class="table table-hover" id="example"  >
    <thead>
        <tr>
            <th>Doctor Name</th>
            <th>Patient Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
          {% for i in appoint %}
          <tr>
           <td>{{i.doctor}}</td>
           <td>{{i.patient}}</td>
           <td>{{i.date1}}</td>
           <td>{{i.time1}}</td>
           
           
<td>
    <form action="{% url 'delete_appointment' i.id %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit"
                class="btn btn-danger"
                onclick="return confirm('Are you sure you want to delete this patient?');">
            Delete
        </button>
    </form>
</td>
          </tr>
          {% endfor %}




    </tbody>
</table>

</div>

{% endblock %}
